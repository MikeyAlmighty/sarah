<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" font-family="sans-serif">
  <title>Venn diagram of two sets A and B</title>
  <rect width="520" height="340" fill="#ffffff"/>
  <circle cx="180" cy="170" r="110" fill="#e07b39" fill-opacity="0.45" stroke="#8a4a1f" stroke-width="2"/>
  <circle cx="340" cy="170" r="110" fill="#7aa83a" fill-opacity="0.45" stroke="#41601a" stroke-width="2"/>
  <g font-size="16" fill="#222" text-anchor="middle">
    <text x="110" y="175">A only</text>
    <text x="260" y="175">A∩B</text>
    <text x="410" y="175">B only</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="180" y="45">Set A</text>
    <text x="340" y="45">Set B</text>
  </g>
  <text x="260" y="310" font-size="15" fill="#222" text-anchor="middle">|A∪B| = |A| + |B| − |A∩B|</text>
</svg>
