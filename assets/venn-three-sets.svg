<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" font-family="sans-serif">
  <title>Venn diagram of three sets A, B and C</title>
  <rect width="600" height="520" fill="#ffffff"/>
  <circle cx="210" cy="300" r="130" fill="#e07b39" fill-opacity="0.45" stroke="#8a4a1f" stroke-width="2"/>
  <circle cx="390" cy="300" r="130" fill="#d4a944" fill-opacity="0.45" stroke="#7a5d14" stroke-width="2"/>
  <circle cx="300" cy="190" r="130" fill="#7aa83a" fill-opacity="0.45" stroke="#41601a" stroke-width="2"/>
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="150" y="335">A only</text>
    <text x="450" y="335">C only</text>
    <text x="300" y="125">B only</text>
    <text x="225" y="215">A∩B</text>
    <text x="375" y="215">B∩C</text>
    <text x="300" y="372">A∩C</text>
    <text x="300" y="270">A∩B∩C</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="80" y="460">Set A</text>
    <text x="300" y="40">Set B</text>
    <text x="520" y="460">Set C</text>
  </g>
  <text x="300" y="500" font-size="14" fill="#222" text-anchor="middle">|A∪B∪C| = |A|+|B|+|C| − |A∩B| − |A∩C| − |B∩C| + |A∩B∩C|</text>
</svg>
