  <circle cx="390" cy="300" r="130" fill="#7aa83a" fill-opacity="0.45" stroke="#41601a" stroke-width="2"/>
  <circle cx="300" cy="190" r="130" fill="#d4a944" fill-opacity="0.45" stroke="#7a5d14" stroke-width="2"/>
  <g fill="#222" text-anchor="middle">
    <text x="130" y="326" font-size="18" font-weight="bold">57</text>
    <text x="130" y="344" font-size="12">A only</text>
    <text x="470" y="326" font-size="18" font-weight="bold">37</text>
    <text x="470" y="344" font-size="12">M only</text>
    <text x="300" y="116" font-size="18" font-weight="bold">17</text>
