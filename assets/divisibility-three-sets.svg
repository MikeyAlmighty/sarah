<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="600" height="550" font-family="sans-serif">
  <title>Integers 1 to 100 divisible by 2, 3 or 5</title>
  <rect width="600" height="550" fill="#ffffff"/>
  <rect x="20" y="20" width="560" height="490" fill="none" stroke="#444" stroke-width="1.5"/>
  <circle cx="210" cy="300" r="130" fill="#e07b39" fill-opacity="0.45" stroke="#8a4a1f" stroke-width="2"/>
  <circle cx="390" cy="300" r="130" fill="#7aa83a" fill-opacity="0.45" stroke="#41601a" stroke-width="2"/>
  <circle cx="300" cy="190" r="130" fill="#d4a944" fill-opacity="0.45" stroke="#7a5d14" stroke-width="2"/>
  <g fill="#222" text-anchor="middle">
    <text x="130" y="326" font-size="18" font-weight="bold">27</text>
    <text x="130" y="344" font-size="12">÷2 only</text>
    <text x="470" y="326" font-size="18" font-weight="bold">7</text>
    <text x="470" y="344" font-size="12">÷5 only</text>
    <text x="300" y="116" font-size="18" font-weight="bold">14</text>
    <text x="300" y="134" font-size="12">÷3 only</text>
    <text x="225" y="208" font-size="18" font-weight="bold">13</text>
    <text x="225" y="226" font-size="12">÷6, not ÷5</text>
    <text x="375" y="208" font-size="18" font-weight="bold">3</text>
    <text x="375" y="226" font-size="12">÷15, not ÷2</text>
    <text x="300" y="346" font-size="9">÷10 not ÷3</text>
    <text x="300" y="370" font-size="18" font-weight="bold">7</text>
    <text x="300" y="266" font-size="18" font-weight="bold">3</text>
    <text x="300" y="284" font-size="12">÷30</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="110" y="462">Divisible by 2: 50</text>
    <text x="490" y="462">Divisible by 5: 20</text>
    <text x="300" y="46">Divisible by 3: 33</text>
  </g>
  <text x="300" y="535" font-size="13" fill="#444" text-anchor="middle">Regions sum to 74; the other 26 of U = {1, …, 100} sit outside.</text>
</svg>
