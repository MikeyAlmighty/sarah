<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" font-family="sans-serif">
  <title>Scotland product survey: two sets inside the population</title>
  <rect width="560" height="380" fill="#ffffff"/>
  <rect x="20" y="20" width="520" height="340" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="40" y="45" font-size="14" fill="#444">Scotland population (N)</text>
  <circle cx="200" cy="190" r="110" fill="#e07b39" fill-opacity="0.45" stroke="#8a4a1f" stroke-width="2"/>
  <circle cx="360" cy="190" r="110" fill="#7aa83a" fill-opacity="0.45" stroke="#41601a" stroke-width="2"/>
  <g font-size="14" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="200" y="72">Heard of A (86%)</text>
    <text x="360" y="72">Heard of B (80%)</text>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="165" y="186" font-size="18" font-weight="bold">16%</text>
    <text x="165" y="206" font-size="13">A only</text>
    <text x="280" y="186" font-size="18" font-weight="bold">70%</text>
    <text x="280" y="206" font-size="13">both</text>
    <text x="395" y="186" font-size="18" font-weight="bold">10%</text>
    <text x="395" y="206" font-size="13">B only</text>
    <text x="480" y="296" font-size="18" font-weight="bold">4%</text>
    <text x="480" y="316" font-size="13">neither</text>
  </g>
  <text x="280" y="365" font-size="13" fill="#444" text-anchor="middle">Outside the circles: 100% − (16% + 70% + 10%) = 4%</text>
</svg>
